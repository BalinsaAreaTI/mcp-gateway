<!doctype html><meta charset="utf-8"><title>Verificación PDF</title><style>body{margin:0;background:#ddd}canvas{display:block;margin:10px auto}#status{text-align:center}</style><div id="status">Cargando</div><script src="pdf.min.js"></script><script>pdfjsLib.GlobalWorkerOptions.workerSrc='pdf.worker.min.js';(async()=>{const name=new URLSearchParams(location.search).get('pdf')||'corto';const pdf=await pdfjsLib.getDocument({url:name+'.pdf',standardFontDataUrl:'standard_fonts/'}).promise;for(let n=1;n<=pdf.numPages;n++){const p=await pdf.getPage(n),v=p.getViewport({scale:1.1}),c=document.createElement('canvas');c.id='page-'+n;c.width=v.width;c.height=v.height;document.body.append(c);await p.render({canvasContext:c.getContext('2d'),viewport:v}).promise;}document.querySelector('#status').textContent=name+': '+pdf.numPages+' páginas';})().catch(e=>document.querySelector('#status').textContent=e.message);</script>
